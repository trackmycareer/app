services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trackmy_career
      POSTGRES_USER: trackmy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackmy -d trackmy_career"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v1.0.1
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./deploy/garage.toml:/etc/garage.toml:ro
    ports:
      - "${S3_PORT:-3900}:3900"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3903/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  garage-init:
    image: minio/mc:latest
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-trackmy-admin-token}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-trackmy-dev-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-trackmy-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-avatars}
    volumes:
      - ./deploy/garage-init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://trackmy:${POSTGRES_PASSWORD}@postgres:5432/trackmy_career?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OAUTH_LINKEDIN_CLIENT_ID: ${OAUTH_LINKEDIN_CLIENT_ID:-}
      OAUTH_LINKEDIN_CLIENT_SECRET: ${OAUTH_LINKEDIN_CLIENT_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-garage:3900}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-trackmy-dev-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-trackmy-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-avatars}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:3900}
      S3_REGION: ${S3_REGION:-garage}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-?Set MFA_ENCRYPTION_KEY in .env}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_CUSTOM_DOMAIN_FALLBACK: ${CF_CUSTOM_DOMAIN_FALLBACK:-}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_PRODUCT_ID_ONE_TIME: ${POLAR_PRODUCT_ID_ONE_TIME:-}
      POLAR_PRODUCT_ID_SUBSCRIPTION: ${POLAR_PRODUCT_ID_SUBSCRIPTION:-}
      COMPENSATION_ENCRYPTION_KEY: ${COMPENSATION_ENCRYPTION_KEY:-?Set COMPENSATION_ENCRYPTION_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_S3_PUBLIC_URL: ${VITE_S3_PUBLIC_URL:-http://localhost:3900}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  garage_meta:
  garage_data:
