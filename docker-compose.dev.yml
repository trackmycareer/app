services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trackmy_career
      POSTGRES_USER: trackmy
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackmy -d trackmy_career"]
      interval: 5s
      timeout: 3s
      retries: 5

  garage:
    image: dxflrs/garage:v1.0.1
    volumes:
      - garage_meta_dev:/var/lib/garage/meta
      - garage_data_dev:/var/lib/garage/data
      - ./deploy/garage.toml:/etc/garage.toml:ro
    ports:
      - "3900:3900"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3903/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage-init:
    image: minio/mc:latest
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./deploy/garage-init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

volumes:
  pgdata_dev:
  garage_meta_dev:
  garage_data_dev:
