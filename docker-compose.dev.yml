services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trackmy_career
      POSTGRES_USER: trackmy
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackmy -d trackmy_career"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
